name: Keep Supabase Active

# Run every 3 days to prevent Supabase project from pausing due to inactivity
on:
  schedule:
    # Runs at 09:00 UTC every 3 days (starting from day 1 of the month)
    - cron: '0 9 1,4,7,10,13,16,19,22,25,28,31 * *'
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Supabase Health Check
    
    steps:
      - name: Log workflow start
        run: echo "Starting Supabase keep-alive health check at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Call health check endpoint
        run: |
          URL="${{ secrets.HEALTH_CHECK_URL }}/api/health"
          RESPONSE=$(curl --fail-with-body --location --silent --show-error \
            --max-time 20 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$URL")
          echo "Health check response: $RESPONSE"
          echo "Supabase health check succeeded"
